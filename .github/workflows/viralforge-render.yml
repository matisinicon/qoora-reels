name: VIRALFORGE · Montar Short

# n8n sube un encargo a viralforge/jobs/<nombre>.json y este flujo monta el vídeo.
# El resultado se publica como release "<nombre>" con video.mp4, portada.jpg, hoja.jpg e info.json.
on:
  push:
    branches: [main]
    paths:
      - "viralforge/jobs/*.json"

permissions:
  contents: write

concurrency:
  group: viralforge-render-${{ github.sha }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Instalar ffmpeg y fuentes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji

      - name: Instalar Whisper (tiempos de la voz de Gemini)
        run: |
          pip install -q faster-whisper
          python3 -c "from faster_whisper import WhisperModel; WhisperModel('small', device='cpu', compute_type='int8')"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viralforge/remotion/package-lock.json

      - name: Preparar Remotion
        working-directory: viralforge/remotion
        run: |
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Montar los encargos nuevos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'viralforge/jobs/*.json' > encargos.txt || true
          cat encargos.txt
          while read -r job; do
            [ -z "$job" ] && continue
            nombre=$(basename "$job" .json)
            rm -rf out work
            # Motor por defecto: Remotion. "motor": "ffmpeg" en el encargo usa el montaje simple.
            motor=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('motor','remotion'))" "$job")
            if [ "$motor" = "ffmpeg" ]; then montar="python3 viralforge/render/render.py"; else montar="viralforge/remotion/montar.sh"; fi
            if $montar "$job"; then
              gh release create "$nombre" out/video.mp4 out/portada.jpg out/hoja.jpg out/info.json out/voz.mp3 $(ls out/escena_* 2>/dev/null) \
                --title "$nombre" --notes "Vídeo VIRALFORGE montado automáticamente" --target "$GITHUB_SHA" --latest=false
            else
              mkdir -p out
              echo "{\"error\": \"El montaje falló\", \"run\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" > out/info.json
              gh release create "$nombre" out/info.json --title "$nombre (error)" --notes "Montaje fallido" --target "$GITHUB_SHA" --latest=false
            fi
            # Aviso a n8n (VIRALFORGE · motor de producción) de que el montaje terminó
            cb=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('callback_url') or '')" "$job")
            if [ -n "$cb" ]; then curl -s -m 20 -X POST -H 'Content-Type: application/json' -d "{\"release\": \"$nombre\"}" "$cb" || true; fi
          done < encargos.txt
