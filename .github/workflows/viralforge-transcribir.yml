name: viralforge-transcribir
on:
  workflow_dispatch:
    inputs:
      archivo:
        required: true
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper
      - name: Transcribir
        run: |
          python3 - <<'PY'
          from faster_whisper import WhisperModel
          import subprocess, numpy as np
          raw = subprocess.run(["ffmpeg", "-nostdin", "-v", "error", "-i", "${{ inputs.archivo }}", "-f", "s16le", "-ac", "1", "-ar", "16000", "-"], capture_output=True, check=True).stdout
          audio = np.frombuffer(raw, np.int16).astype(np.float32) / 32768.0
          m = WhisperModel("small", compute_type="int8")
          segs, info = m.transcribe(audio, word_timestamps=False)
          print("IDIOMA", info.language)
          for s in segs: print(f"[{s.start:6.2f}-{s.end:6.2f}] {s.text}")
          PY
